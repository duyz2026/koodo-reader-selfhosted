<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" role="img">
<title>koodo-sync-hub 部署五步</title>
<desc>部署流程五步：上传代码、执行安装、验证服务、备份数据、冻结版本</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="510" fill="#FFFFFF"/>

<text x="340" y="30" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">部署五步（已在 T460p 实测通过）</text>

<rect x="190" y="50" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="72" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">1. 上传代码</text>
<text x="340" y="90" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">1Panel 上传并解压到 /opt</text>

<path d="M340 106 L340 142" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="146" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="168" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">2. 执行安装</text>
<text x="340" y="186" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">install.sh，模式 3 + 8090</text>

<path d="M340 202 L340 238" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="242" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="264" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">3. 验证服务</text>
<text x="340" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">网页版 200，数据源可达</text>

<path d="M340 298 L340 334" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="338" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">4. 备份数据</text>
<text x="340" y="378" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">koodo-hub backup</text>

<path d="M340 394 L340 430" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="434" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="456" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">5. 冻结版本</text>
<text x="340" y="474" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">koodo-hub freeze，锁 digest</text>
</svg>
