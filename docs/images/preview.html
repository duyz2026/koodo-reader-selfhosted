<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>koodo-sync-hub 关键步骤图示</title>
<style>
  body { margin:0; padding:24px 16px; background:#FAFAF8; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:18px; font-weight:500; text-align:center; color:#2C2C2A; margin:8px 0 24px; }
  figure { margin:0 0 32px; background:#fff; border-radius:12px; padding:20px; }
  img { width:100%; display:block; border-radius:8px; }
  figcaption { margin-top:14px; font-size:14px; color:#5F5E5A; text-align:center; }
  .tip { font-size:13px; color:#888780; text-align:center; margin-top:8px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>koodo-sync-hub 关键步骤图示</h1>

  <figure>
    <img src="01-部署拓扑.svg" alt="部署拓扑">
    <figcaption>图 1　部署拓扑：开发机 → 服务器 → 多端</figcaption>
  </figure>

  <figure>
    <img src="02-部署五步.svg" alt="部署五步">
    <figcaption>图 2　部署五步：上传 → 安装 → 验证 → 备份 → 冻结</figcaption>
  </figure>

  <figure>
    <img src="03-版本冻结双锁.svg" alt="版本冻结双锁">
    <figcaption>图 3　版本冻结：镜像 digest 锁 + git tag 锁</figcaption>
  </figure>

  <figure>
    <img src="04-书在哪里.svg" alt="书在哪里">
    <figcaption>图 4　书在哪里：设备 / 服务器 / 官方云 / 备份 的关系（第 5 期用图）</figcaption>
  </figure>

  <p class="tip">
    前两张为 4:3 比例，竖向排列；图 4 为横版。<br>
    转为 PNG 方法：浏览器打开本页 → 对每张图截图（Win + Shift + S）→ 粘贴到公众号后台。
  </p>
</div>
</body>
</html>
