<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" role="img">
<title>koodo-sync-hub 部署拓扑</title>
<desc>开发机 X1 上传代码到 T460p 服务器，服务器 Docker 内运行 Caddy 反代与 Koodo 数据源、网页版，多端客户端通过数据源地址同步</desc>
